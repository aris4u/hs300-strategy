<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>沪深300指数增强</title>
  <style>
    :root {
      --bg: #101218;
      --panel: #171b24;
      --panel-2: #1e2430;
      --line: #2c3340;
      --text: #e8eaed;
      --muted: #8b93a1;
      --dim: #5c6573;
      --hold: #3b82f6;
      --try: #22a06b;
      --cut: #e67e22;
      --flat: #e24c4c;
      --idle: #6b7380;
      --focus: #4c8dff;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font: 13px/1.45 "Segoe UI", "Microsoft YaHei", sans-serif;
      overflow: hidden;
      user-select: none;
    }
    button, input { font: inherit; color: inherit; }
    #app {
      display: grid;
      grid-template-rows: 56px 1fr 28px;
      height: 100%;
    }
    .tabs { display: flex; gap: 4px; margin-right: 8px; }
    .tab {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 4px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .tab.on { color: var(--text); background: var(--panel-2); border-color: #4a5363; }
    .scheme-switch {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin: 0 0 14px;
    }
    .scheme-btn {
      text-align: left;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--muted);
      border-radius: 8px;
      padding: 12px 16px;
      cursor: pointer;
    }
    .scheme-btn .scheme-num {
      display: block;
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.04em;
    }
    .scheme-btn .scheme-sub {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      color: var(--muted);
    }
    .scheme-btn.on {
      border-color: var(--focus);
      background: #1a2436;
      box-shadow: inset 0 0 0 1px var(--focus);
    }
    .scheme-btn.on .scheme-num { color: #d6e4ff; }
    .scheme-btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .overview {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px 16px 10px;
      margin: 0 0 14px;
    }
    .overview h2 {
      margin: 0 0 8px;
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
    }
    .overview .overview-name {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 10px;
    }
    .overview dl {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 8px 12px;
      margin: 0 0 14px;
    }
    .overview dt {
      color: var(--muted);
      font-size: 12px;
      padding-top: 1px;
    }
    .overview dd {
      margin: 0;
      color: var(--text);
      font-size: 13px;
      line-height: 1.55;
      user-select: text;
    }
    .overview-sub {
      margin: 4px 0 8px;
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
    }
    .overview-compare-note,
    .overview-limit {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
      margin: 0 0 8px;
      user-select: text;
    }
    .compare-charts {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 0 0 14px;
    }
    .compare-charts .enhance-chart { margin-bottom: 0; }
    .compare-cap {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 6px;
    }
    .section-h {
      margin: 16px 0 8px;
      font-size: 13px;
      font-weight: 650;
      color: var(--text);
    }
    .scheme-note {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 10px;
    }
    #view-picks { display: grid; grid-template-columns: 300px 1fr; min-height: 0; }
    #view-enhance { display: none; overflow: auto; padding: 14px 18px 20px; height: 100%; box-sizing: border-box; }
    #app[data-view="enhance"] #view-picks { display: none; }
    #app[data-view="enhance"] #view-enhance { display: block; }
    #app[data-view="enhance"] .chips,
    #app[data-view="enhance"] .search,
    #app[data-view="screen"] .chips,
    #app[data-view="screen"] .search { display: none; }
    #view-screen { display: none; overflow: auto; padding: 14px 18px 20px; height: 100%; box-sizing: border-box; }
    #view-screen .stats {
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: 6px;
      margin-bottom: 8px;
    }
    #view-screen .stat {
      padding: 6px 8px;
      border-radius: 4px;
    }
    #view-screen .stat .k { font-size: 10px; }
    #view-screen .stat .v { font-size: 15px; margin-top: 2px; }
    #view-screen .rule { font-size: 11px; margin: 0 0 8px; }
    #app[data-view="screen"] #view-picks { display: none; }
    #app[data-view="screen"] #view-enhance { display: none; }
    #app[data-view="screen"] #view-screen { display: block; }
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(128px, 1fr));
      gap: 8px;
      margin-bottom: 12px;
    }
    .stat {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 10px 12px;
    }
    .stat .k { color: var(--muted); font-size: 11px; }
    .stat .v { font-size: 18px; font-weight: 650; margin-top: 4px; font-variant-numeric: tabular-nums; }
    .stat .v.pos { color: #e24c4c; }
    .stat .v.neg { color: #22a06b; }
    .enhance-chart {
      background: #fff;
      border-radius: 6px;
      overflow: auto;
      margin-bottom: 14px;
    }
    .enhance-chart img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
    .rule {
      color: var(--muted);
      font-size: 12px;
      margin: 0 0 12px;
    }
    .month-table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    .month-table th, .month-table td { text-align: right; padding: 5px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .month-table th:first-child, .month-table td:first-child { text-align: left; }
    .month-table.text-table th, .month-table.text-table td { text-align: left; font-variant-numeric: normal; }
    .month-table td.pos { color: #e24c4c; }
    .month-table td.neg { color: #3dd68c; }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 0 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    .brand {
      display: flex;
      flex-direction: column;
      min-width: 168px;
    }
    .brand b { font-size: 14px; letter-spacing: 0.04em; }
    .brand span { color: var(--muted); font-size: 11px; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .chip:hover { border-color: #4a5363; color: var(--text); }
    .chip.on { color: var(--text); background: var(--panel-2); }
    .chip[data-k="试多"].on { border-color: var(--try); color: var(--try); }
    .chip[data-k="持有"].on { border-color: var(--hold); color: var(--hold); }
    .chip[data-k="减仓"].on { border-color: var(--cut); color: var(--cut); }
    .chip[data-k="清仓"].on { border-color: var(--flat); color: var(--flat); }
    .chip em { font-style: normal; font-variant-numeric: tabular-nums; margin-left: 6px; }
    .search {
      margin-left: auto;
      width: 220px;
      background: var(--bg);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 6px 10px;
      outline: none;
    }
    .search:focus { border-color: var(--focus); }
    main {
      min-height: 0;
      overflow: hidden;
    }
    .list {
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 0;
      background: var(--panel);
    }
    .list-meta {
      padding: 8px 12px;
      color: var(--muted);
      font-size: 11px;
      border-bottom: 1px solid var(--line);
    }
    .rows {
      overflow: auto;
      flex: 1;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      padding: 8px 12px;
      border-bottom: 1px solid #1c212b;
      cursor: pointer;
    }
    .row:hover { background: #1c222d; }
    .row.sel { background: #243044; }
    .row .name { font-weight: 600; }
    .row .code { color: var(--dim); font-size: 11px; font-variant-numeric: tabular-nums; }
    .row .right { text-align: right; }
    .tag {
      display: inline-block;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 3px;
      font-weight: 600;
    }
    .tag.试多 { color: #0d3b2a; background: #3dd68c; }
    .tag.持有 { color: #0b2a55; background: #7eb6ff; }
    .tag.减仓 { color: #4a2a08; background: #f0b27a; }
    .tag.清仓 { color: #4a1010; background: #f1948a; }
    .tag.观望 { color: #c5c9d0; background: #3a414d; }
    .row .sub { color: var(--muted); font-size: 11px; }
    .stage {
      display: grid;
      grid-template-rows: auto 1fr 168px;
      min-height: 0;
      background: var(--bg);
    }
    .hero {
      padding: 12px 16px 8px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 14px;
      border-bottom: 1px solid var(--line);
    }
    .hero h1 { margin: 0; font-size: 20px; font-weight: 650; }
    .hero .meta { color: var(--muted); }
    .hero .pill {
      margin-left: auto;
      font-size: 18px;
      font-weight: 700;
    }
    .hero .pill.试多 { color: var(--try); }
    .hero .pill.持有 { color: var(--hold); }
    .hero .pill.减仓 { color: var(--cut); }
    .hero .pill.清仓 { color: var(--flat); }
    .hero .pill.观望 { color: var(--idle); }
    .chart-wrap {
      min-height: 0;
      overflow: auto;
      background: #0c0e13;
      padding: 8px;
    }
    .chart-wrap img {
      display: block;
      width: 100%;
      height: auto;
      background: #fff;
      border-radius: 4px;
    }
    .empty {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
    }
    .detail {
      border-top: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      grid-template-columns: 1.15fr 1fr;
      min-height: 0;
      overflow: hidden;
    }
    .detail .col {
      padding: 10px 14px;
      overflow: auto;
      font-size: 12px;
      color: #c7ccd4;
      user-select: text;
    }
    .detail .col + .col { border-left: 1px solid var(--line); }
    .detail h3 {
      margin: 0 0 6px;
      font-size: 11px;
      color: var(--muted);
      font-weight: 600;
      letter-spacing: 0.06em;
    }
    .detail p { margin: 0 0 8px; white-space: pre-wrap; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { text-align: left; padding: 3px 6px 3px 0; }
    th { color: var(--dim); font-weight: 500; }
    td.q-高价值 { color: #3dd68c; }
    td.q-低价值 { color: #f1948a; }
    td.q-中性 { color: #d5b35a; }
    footer {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 0 14px;
      border-top: 1px solid var(--line);
      color: var(--dim);
      font-size: 11px;
      background: var(--panel);
    }
    #clock {
      color: var(--text);
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.03em;
      white-space: nowrap;
      min-width: 168px;
    }
    #tdxTick {
      margin-left: auto;
      color: var(--text);
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 52%;
    }
    #tdxTick .pos { color: #e24c4c; }
    #tdxTick .neg { color: #22a06b; }
    .live-btn {
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--text);
      border-radius: 4px;
      padding: 5px 10px;
      cursor: pointer;
    }
    .live-btn:disabled { opacity: 0.5; cursor: default; }
    .live-tag {
      font-size: 11px;
      color: #d5b35a;
      white-space: nowrap;
    }
    .live-status { margin-left: 16px; }
    .live-status.on { color: #3dd68c; }
    .live-status.on::before {
      content: "";
      display: inline-block;
      width: 7px;
      height: 7px;
      margin-right: 6px;
      border-radius: 50%;
      background: #3dd68c;
      box-shadow: 0 0 0 0 rgba(61, 214, 140, 0.7);
      animation: livePulse 1.4s ease-out infinite;
    }
    @keyframes livePulse {
      0% { box-shadow: 0 0 0 0 rgba(61, 214, 140, 0.7); }
      70% { box-shadow: 0 0 0 8px rgba(61, 214, 140, 0); }
      100% { box-shadow: 0 0 0 0 rgba(61, 214, 140, 0); }
    }
    .live-status.warn { color: #d5b35a; }
    .live-status.err { color: #f1948a; }
    footer kbd {
      border: 1px solid #3a414d;
      border-radius: 3px;
      padding: 0 4px;
      margin: 0 2px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div id="app" data-view="screen">
    <header>
      <div class="brand">
        <b>沪深300选股筛选</b>
        <span id="asof">读取本地结果中…</span>
      </div>
      <div class="tabs">
        <button class="tab on" data-view="screen">选股筛选</button>
        <button class="tab" data-view="enhance">指数增强</button>
        <button class="tab" data-view="picks">选股建议</button>
      </div>
      <div class="chips" id="chips"></div>
      <input class="search" id="q" placeholder="搜索代码 / 名称    /" />
    </header>
    <main>
    <div id="view-picks">
      <aside class="list">
        <div class="list-meta" id="listMeta"></div>
        <div class="rows" id="rows"></div>
      </aside>
      <section class="stage">
        <div class="hero" id="hero"></div>
        <div class="chart-wrap" id="chart"></div>
        <div class="detail">
          <div class="col" id="left"></div>
          <div class="col" id="right"></div>
        </div>
      </section>
    </div>
    <div id="view-enhance">
      <div class="scheme-switch" id="enhanceSchemes"></div>
      <div id="enhanceSchemePanel">
        <section class="overview" id="enhanceOverview">
          <h2>方案概述</h2>
          <div class="overview-name" id="overviewName"></div>
          <dl id="overviewBody"></dl>
        </section>
        <h3 class="section-h">回测结果</h3>
        <p class="scheme-note" id="enhanceSchemeNote"></p>
        <div class="stats" id="enhanceStats"></div>
        <h3 class="section-h">分段对照</h3>
        <table class="month-table" id="enhancePeriods"></table>
        <div class="enhance-chart" id="enhanceChart"></div>
        <h3 class="section-h">月度超额</h3>
        <table class="month-table" id="enhanceMonth"></table>
      </div>
      <div id="enhanceComparePanel" style="display:none">
        <section class="overview">
          <h2>方案对比</h2>
          <div class="overview-name">方案一 vs 方案二 vs 沪深300</div>
          <p class="overview-compare-note" id="compareLead"></p>
          <h3 class="overview-sub">规则对照</h3>
          <table class="month-table text-table" id="compareRules"></table>
          <p class="overview-limit" id="compareLimit"></p>
        </section>
        <h3 class="section-h">分段对照（沪深300 / 方案一 / 方案二）</h3>
        <table class="month-table" id="comparePeriods"></table>
        <div class="compare-charts">
          <div>
            <p class="compare-cap">方案一净值</p>
            <div class="enhance-chart" id="compareChartA"></div>
          </div>
          <div>
            <p class="compare-cap">方案二净值</p>
            <div class="enhance-chart" id="compareChartB"></div>
          </div>
        </div>
        <h3 class="section-h">月度对照（沪深300 / 方案一 / 方案二）</h3>
        <table class="month-table" id="compareMonth"></table>
      </div>
    </div>
    <div id="view-screen">
      <p class="rule" id="screenRule"></p>
      <div class="stats" id="screenStats"></div>
      <div class="enhance-chart" id="screenChart"></div>
      <table class="month-table" id="screenToday"></table>
    </div>
    </main>
    <footer>
      <span id="clock">—</span>
      规则提示，不是投资建议。
      <span id="liveStatus" class="live-status">行情未刷新</span>
      <span id="dailyStatus" class="live-status" title="收盘后自动补最新交易日；点击可强制重跑">日K —</span>
      <span id="tdxTick">通达信 —</span>
      <span>
        <kbd>↑</kbd><kbd>↓</kbd> 选股页切换
        <kbd>/</kbd> 搜索
        <kbd>Esc</kbd> 清筛选
      </span>
    </footer>
  </div>
  <script>
    const ACTIONS = ["全部", "试多", "持有", "减仓", "清仓", "观望"];
    let board = { stocks: [], counts: {}, asof: null };
    let filter = "关注";
    let query = "";
    let selected = null;
    let visible = [];
    let liveTimer = null;
    let liveBusy = false;
    let livePollMs = 5000;
    let liveOn = true;
    let liveLoopId = 0;
    let liveAbort = null;

    const $ = (id) => document.getElementById(id);
    let enhance = null;
    let enhanceScheme = "env_top5";
    let screenData = null;

    function colorClass(action) { return action || "观望"; }

    function pct(x, d) {
      if (x == null || Number.isNaN(Number(x))) return "—";
      return (Number(x) * 100).toFixed(d == null ? 2 : d) + "%";
    }
    function signedPct(x, d) {
      const n = Number(x);
      const s = pct(n, d);
      return n > 0 ? "+" + s : s;
    }
    function signClass(x) { return Number(x) >= 0 ? "pos" : "neg"; }

    function autoLiveOn() {
      return !!(board && board.session_open);
    }

    function setView(v) {
      $("app").dataset.view = v;
      document.querySelectorAll(".tab").forEach((t) => t.classList.toggle("on", t.dataset.view === v));
      if (v === "enhance") {
        ensureEnhance();
        const pack = currentEnhance();
        const m = pack && pack.metrics;
        if (m) $("asof").textContent = `${m.start} ~ ${m.end}　${m.days} 个交易日　${enhanceScheme === "ct_all" ? "方案二" : "方案一"}`;
        else if (enhanceScheme === "compare") $("asof").textContent = "方案一 vs 方案二 vs 沪深300";
      } else if (v === "screen") {
        ensureScreen();
        if (screenData && screenData.ok) {
          const p = screenData.proof || {};
          $("asof").textContent = p.verdict || "选股筛选";
        }
      } else if (board && board.ok) {
        $("asof").textContent = `K线截至 ${board.asof || "—"}　建议表 ${board.generated_at || ""}`;
      }
      if (v === "picks") {
        render();
        if (selected) {
          loadDetail(selected);
          if (autoLiveOn()) startLive(selected);
          else stopLive();
        }
      } else {
        stopLive();
      }
    }

    function renderScreen() {
      if (!screenData || !screenData.ok) {
        $("screenRule").textContent = (screenData && screenData.error) || "还没有筛选结果。请先运行 python run_screen.py";
        $("screenStats").innerHTML = "";
        $("screenChart").innerHTML = "";
        $("screenToday").innerHTML = "";
        return;
      }
      const p = screenData.proof || {};
      const lr = (p.long_vs_rest || {});
      $("screenRule").textContent = p.screen_rule || p.method || "";
      const cards = [
        ["持仓−未入选年化", signedPct(lr.annual), signClass(lr.annual)],
        ["t 统计量", lr.t_stat != null ? Number(lr.t_stat).toFixed(2) : "—", signClass(lr.mean_daily)],
        ["p 值", lr.p_value != null ? Number(lr.p_value).toFixed(3) : "—"],
        ["日胜率", pct(lr.win_rate, 1)],
        ["推荐", String((screenData.today || []).filter((x) => x.bucket === "推荐").length)],
        ["观察", String((screenData.today || []).filter((x) => x.bucket === "观察").length)],
      ];
      $("screenStats").innerHTML = cards.map(([k, v, c]) =>
        `<div class="stat"><div class="k">${k}</div><div class="v ${c || ""}">${v}</div></div>`
      ).join("");
      $("screenChart").innerHTML = screenData.has_chart
        ? `<img src="${screenData.chart}" alt="选股检验" decoding="async" />`
        : "";
      const rows = (screenData.today || []).map((r) => `
        <tr>
          <td>${r.bucket || ""}</td>
          <td>${r.name || ""} ${r.ts_code || ""}</td>
          <td>${r.last_launch || "—"}</td>
          <td>${r.bars_ago ?? "—"}</td>
          <td>${r.l2jbl == null ? "—" : Number(r.l2jbl).toFixed(3)}</td>
          <td class="tdx-px" data-code="${r.ts_code}">${r.tdx_price ?? "—"}</td>
        </tr>`).join("");
      $("screenToday").innerHTML = `

        <h3>最近启动（事后档案，非实时过滤）</h3>
        <table>
          <thead><tr><th>日期</th><th>质量</th><th>超额MFE</th><th>MAE</th><th>超额收益</th></tr></thead>
          <tbody>${body}</tbody>
        </table>
      `;
    }

    function setLiveStatus(text, cls) {
      const el = $("liveStatus");
      if (!el) return;
      el.textContent = text;
      el.className = "live-status" + (cls ? " " + cls : "");
    }

    let lastAdviceMtime = null;
    let lastEnhanceMtime = null;
    let lastScreenMtime = null;
    let dailyTimer = null;

    function setDailyStatus(d) {
      const el = $("dailyStatus");
      if (!el) return;
      el.textContent = (d && d.label) || "日K —";
      el.className = "live-status" + (d && d.cls ? " " + d.cls : "");
    }

    async function reloadBoard() {
      const boardRes = await fetch("/api/board");
      board = await boardRes.json();
      if (!board.ok) return;
      if (!selected && board.stocks && board.stocks.length) {
        selected = (filtered()[0] || board.stocks[0]).ts_code;
      }
      render();
      const view = $("app").dataset.view;
      if (view === "picks" || !view) {
        $("asof").textContent = `K线截至 ${board.asof || "—"}　建议表 ${board.generated_at || ""}`;
        if (selected) loadDetail(selected);
      }
    }

    async function pollDaily() {
      try {
        const d = await fetch("/api/daily").then((r) => r.json());
        setDailyStatus(d);
        if (d.advice_mtime && lastAdviceMtime && d.advice_mtime !== lastAdviceMtime) {
          await reloadBoard();
        } else if (!board.ok && d.advice_mtime) {
          await reloadBoard();
        }
        if (d.enhance_mtime && lastEnhanceMtime && d.enhance_mtime !== lastEnhanceMtime) {
          enhanceLoaded = false;
          enhanceLoading = null;
          enhance = null;
          ensureEnhance();
        }
        if (d.screen_mtime && lastScreenMtime && d.screen_mtime !== lastScreenMtime) {
          screenLoaded = false;
          screenLoading = null;
          screenData = null;
          ensureScreen();
        }
        lastAdviceMtime = d.advice_mtime || lastAdviceMtime;
        lastEnhanceMtime = d.enhance_mtime || lastEnhanceMtime;
        lastScreenMtime = d.screen_mtime || lastScreenMtime;
        const ms = d.running || d.step === "wait" ? 3000 : 30000;
        clearTimeout(dailyTimer);
        dailyTimer = setTimeout(pollDaily, ms);
      } catch (err) {
        dailyTimer = setTimeout(pollDaily, 15000);
      }
    }

    function stopLive() {
      liveOn = false;
      liveLoopId += 1;
      if (liveTimer) {
        clearTimeout(liveTimer);
        liveTimer = null;
      }
      if (liveAbort) {
        liveAbort.abort();
        liveAbort = null;
      }
    }

    function startLive(code) {
      stopLive();
      if (!code) return;
      liveOn = true;
      const loopId = liveLoopId;
      const tick = async () => {
        if (!liveOn || loopId !== liveLoopId || selected !== code) return;
        if ($("app").dataset.view === "picks" && document.visibilityState === "visible") {
          await refreshLive(code, false);
        }
        if (!liveOn || loopId !== liveLoopId || selected !== code) return;
        liveTimer = setTimeout(tick, livePollMs);
      };
      liveTimer = setTimeout(tick, 0);
    }

    function applyLiveHero(s, d) {
      const meta = $("liveMeta");
      const pill = $("livePill");
      const tag = $("liveTag");
      if (!meta || !pill) {
        renderHero(s, d);
        return;
      }
      const priceLabel = d.live ? "现价" : "收盘";
      meta.textContent = `${s.ts_code}${d.date ? " · " + d.date : ""}${d.close != null ? " · " + priceLabel + " " + Number(d.close).toFixed(2) : ""}`;
      pill.className = "pill " + colorClass(d.action || s.action);
      pill.textContent = `${d.action || s.action}　状态机 ${d.position_hint || s.position_hint}　${d.confidence || s.confidence || "信号"}`;
      if (tag) tag.textContent = d.live
        ? ((d.session_open ? "自动实时" : "自动待命") + (d.preview ? " · 盘中预览" : " · 收盘快照"))
        : "";
    }

    async function refreshLive(code, manual) {
      if (!code) return;
      if (liveAbort) liveAbort.abort();
      const ac = new AbortController();
      liveAbort = ac;
      liveBusy = true;
      const btn = $("liveBtn");
      if (btn && manual) btn.disabled = true;
      if (manual) setLiveStatus("正在拉行情并重算信号…", "warn");
      try {
        const q = manual ? "?manual=1" : "";
        const res = await fetch("/api/live/" + encodeURIComponent(code) + q, { signal: ac.signal });
        const d = await res.json();
        if (selected !== code) return;
        if (!d.ok) {
          setLiveStatus(d.error || "行情刷新失败", "err");
          return;
        }
        const sec = Number(d.poll_seconds);
        livePollMs = (sec > 0 ? sec : 5) * 1000;
        const s = board.stocks.find((x) => x.ts_code === code);
        if (s) {
          s.action = d.action;
          s.position_hint = d.position_hint;
          s.confidence = d.confidence;
          s.headline = d.headline;
          s.has_chart = true;
          s.chart = d.chart;
          s.chart_ts = d.chart_ts;
          s.signal_date = d.signal_date;
          s.entry_date = d.entry_date;
        }
        const row = document.querySelector(`.row[data-code="${code}"]`);
        if (row) {
          const t = row.querySelector(".tag");
          if (t) {
            t.className = "tag " + colorClass(d.action);
            t.textContent = d.action;
          }
        }
        applyLiveHero(s, d);
        if (d.chart_changed) renderChart(s || d);
        const left = $("left");
        const leftSig = `${d.preview ? 1 : 0}|${d.headline}|${d.detail}`;
        if (left && left.dataset.sig !== leftSig) {
          left.dataset.sig = leftSig;
          left.innerHTML = `
          <h3>当日建议（${d.preview ? "盘中预览" : "收盘快照"}）</h3>
          <p>${d.headline}</p>
          <p>${d.detail}</p>
        `;
        }
        const flags = (d.flags && d.flags.length) ? d.flags.join("、") : "无新信号";
        const wait = d.poll_seconds ? `${d.poll_seconds}s` : "";
        setLiveStatus(
          `自动实时 ${wait}  ${d.quote_time || ""}  ${d.action}  ${flags}`,
          d.session_open ? "on" : "warn"
        );
      } catch (err) {
        if (err && err.name === "AbortError") return;
        setLiveStatus(String(err), "err");
      } finally {
        liveBusy = false;
        const b = $("liveBtn");
        if (b) b.disabled = false;
      }
    }

    async function loadDetail(code) {
      const s = board.stocks.find((x) => x.ts_code === code);
      renderHero(s);
      renderChart(s);
      renderFallbackDetail(s);
      if (autoLiveOn()) startLive(code);
      else stopLive();
      try {
        const res = await fetch("/api/stock/" + encodeURIComponent(code));
        const d = await res.json();
        if (selected !== code) return;
        if (!d.ok) {
          $("left").innerHTML += `<p>${d.error || "明细读取失败"}</p>`;
          return;
        }
        renderLaunches(d.launches);
      } catch (err) {
        $("right").innerHTML = `<h3>启动档案</h3><p>${err}</p>`;
      }
    }

    function render() {
      renderChips();
      renderList();
      const s = current();
      if (s && s.ts_code !== selected) selected = s.ts_code;
    }

    $("rows").onclick = (e) => {
      const row = e.target.closest(".row");
      if (!row) return;
      selected = row.dataset.code;
      location.hash = selected;
      document.querySelectorAll("#rows .row").forEach((el) => {
        el.classList.toggle("sel", el.dataset.code === selected);
      });
      loadDetail(selected);
    };

    $("q").oninput = (e) => {
      query = e.target.value;
      render();
    };

    document.addEventListener("keydown", (e) => {
      if (e.key === "/" && document.activeElement !== $("q")) {
        e.preventDefault();
        $("q").focus();
        $("q").select();
        return;
      }
      if (e.key === "Escape") {
        $("q").blur();
        query = "";
        $("q").value = "";
        filter = "关注";
        render();
        return;
      }
      if (document.activeElement === $("q")) return;
      if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
      e.preventDefault();
      const i = visible.findIndex((s) => s.ts_code === selected);
      const n = e.key === "ArrowDown" ? i + 1 : i - 1;
      if (n < 0 || n >= visible.length) return;
      selected = visible[n].ts_code;
      location.hash = selected;
      document.querySelectorAll("#rows .row").forEach((el) => {
        el.classList.toggle("sel", el.dataset.code === selected);
      });
      loadDetail(selected);
      const el = document.querySelector(`.row[data-code="${selected}"]`);
      if (el) el.scrollIntoView({ block: "nearest" });
    });

    let tdxBusy = false;

    function tdxCodes() {
      const codes = ["000300.SH"];
      if (selected) codes.push(selected);
      const view = $("app") && $("app").dataset.view;
      if (view === "screen") {
        (screenData && screenData.today ? screenData.today : []).forEach((r) => {
          if (r.ts_code) codes.push(r.ts_code);
        });
      }
      return [...new Set(codes)].slice(0, 40);
    }

    function fmtQuote(q) {
      if (!q || q.price == null) return "—";
      const px = Number(q.price).toFixed(2);
      if (q.pct == null || Number.isNaN(Number(q.pct))) return px;
      const n = Number(q.pct);
      const p = (n * 100).toFixed(2) + "%";
      return px + " " + (n > 0 ? "+" + p : p);
    }

    function applyTdx(payload) {
      const quotes = (payload && payload.quotes) || {};
      const idx = quotes["000300.SH"];
      const stk = selected ? quotes[selected] : null;
      const s = board.stocks && selected ? board.stocks.find((x) => x.ts_code === selected) : null;
      const name = s && s.name ? s.name : (selected || "");
      const idxHtml = idx
        ? `沪深300 <span class="${signClass(idx.pct)}">${fmtQuote(idx)}</span>`
        : "沪深300 —";
      let stockHtml = "";
      if (stk) {
        stockHtml = `　${name} <span class="${signClass(stk.pct)}">${fmtQuote(stk)}</span>`;
        if (stk.bid1 != null && stk.ask1 != null) {
          stockHtml += `　买${Number(stk.bid1).toFixed(2)} 卖${Number(stk.ask1).toFixed(2)}`;
        }
      }
      const t = payload.quote_time ? "　" + payload.quote_time : "";
      const el = $("tdxTick");
      if (el) el.innerHTML = "通达信 " + idxHtml + stockHtml + t;
      document.querySelectorAll("td.tdx-px").forEach((td) => {
        const q = quotes[td.dataset.code];
        if (q && q.price != null) td.textContent = Number(q.price).toFixed(2);
      });
      if (stk && $("liveMeta") && name) {
        const d = $("liveMeta");
        const datePart = d.textContent.includes(" · ") ? d.textContent.split(" · ")[1] : "";
        const day = datePart && /^\d{4}/.test(datePart) ? datePart.split(" · ")[0] : "";
        d.textContent = `${selected}${day ? " · " + day : ""} · 通达信 ${Number(stk.price).toFixed(2)}`;
      }
      if (!autoLiveOn() && (idx || stk)) {
        setLiveStatus(`通达信已连接 盘后 ${payload.quote_time || ""}`.trim(), "on");
      }
    }

    async function refreshTdx() {
      if (tdxBusy || document.visibilityState === "hidden") return;
      tdxBusy = true;
      try {
        const codes = tdxCodes().map(encodeURIComponent).join(",");
        const res = await fetch("/api/tdx?codes=" + codes);
        const d = await res.json();
        if (d && d.ok) applyTdx(d);
        else if (!autoLiveOn()) setLiveStatus("行情未刷新", "err");
      } catch (_) {
        if (!autoLiveOn()) setLiveStatus("行情未刷新", "err");
      } finally {
        tdxBusy = false;
      }
    }
    function tickClock() {
      const el = $("clock");
      if (el) {
        el.textContent = new Intl.DateTimeFormat("zh-CN", {
          timeZone: "Asia/Shanghai",
          year: "numeric",
          month: "2-digit",
          day: "2-digit",
          weekday: "short",
          hour: "2-digit",
          minute: "2-digit",
          second: "2-digit",
          hour12: false,
        }).format(new Date());
      }
      refreshTdx();
    }

    async function boot() {
      tickClock();
      setInterval(tickClock, 1000);
      document.querySelectorAll(".tab").forEach((t) => {
        t.onclick = () => setView(t.dataset.view);
      });
      const boardRes = await fetch("/api/board");
      board = await boardRes.json();
      const closed = Number(board.live_poll_closed_seconds);
      livePollMs = ((board.session_open
        ? Number(board.live_poll_seconds)
        : (closed > 0 ? closed : 30)) || 5) * 1000;
      const hash = decodeURIComponent((location.hash || "").replace("#", ""));
      const viewHash = hash.split("?")[0];
      let initial = "screen";
      if (viewHash === "enhance" || viewHash === "picks" || viewHash === "screen") {
        initial = viewHash;
      } else if (board.ok && board.stocks.some((s) => s.ts_code === viewHash)) {
        initial = "picks";
      }
      function wireDaily() {
        pollDaily();
        const dailyEl = $("dailyStatus");
        if (dailyEl) {
          dailyEl.style.cursor = "pointer";
          dailyEl.onclick = async () => {
            try {
              const d = await fetch("/api/daily", { method: "POST" }).then((r) => r.json());
              setDailyStatus(d);
            } catch (err) {}
          };
        }
      }
      if (!board.ok) {
        setView(initial);
        wireDaily();
        return;
      }
      selected = board.stocks.some((s) => s.ts_code === hash)
        ? hash
        : (filtered()[0] || board.stocks[0] || {}).ts_code;
      render();
      setView(initial);
      if (initial !== "enhance") ensureEnhance();
      if (initial !== "screen") ensureScreen();
      wireDaily();
    }
    boot();
  </script>
</body>
</html>
